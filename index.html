<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F3EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CallSheet">
<title>CallSheet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23B23A0A'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='800' font-size='36' fill='white' text-anchor='middle'%3ECS%3C/text%3E%3C/svg%3E">

<meta name="description" content="CallSheet: local contractors by trade for property owners and managers in Kentucky. Post a job, compare sealed bids, hire.">
</head>
<body>
<div class="app">
  <header>
    <div style="display:flex;align-items:center;gap:10px"><h1 class="brand">Call<span>Sheet</span></h1></div>
    <div id="hdr" style="display:flex;gap:8px;align-items:center"></div>
  </header>
  <main id="main"><div class="empty" id="boot">Loading…</div></main>
</div>
<nav class="bottom" aria-label="Sections" hidden><div class="inner" id="nav"></div></nav>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="qrcode.js"></script>
<script src="app.js"></script>
